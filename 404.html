<script>
  /* CDN blocked, offline, or a bad hash? Fall back to the copies committed
     in assets/vendor. document.write preserves the parse order these
     libraries depend on, and the fallback is same-origin, so Chrome's
     document.write intervention does not apply to it. */
  (function () {
    var need = [["gsap","gsap.min.js"]];
    for (var i = 0; i < need.length; i++) {
      if (!window[need[i][0]]) {
        document.write('<script src="/assets/vendor/' + need[i][1] + '"><\/script>');
      }
    }
  })();
</script>

<!-- Cloudflare Web Analytics — cookieless, no fingerprinting, nothing stored

     so a pinned hash would break the day they ship a change. type="module"
     defers it by default, so it never blocks the page. -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "f0fe9858476c4810bfba3d028e0054c9"}'></script>
